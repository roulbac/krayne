[project]
name = "stratus-sky"
version = "0.1.0"
description = "A k9s-style terminal UI for SkyPilot: clusters, managed jobs, services and volumes without hand-written YAML"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10,<3.14"
keywords = ["skypilot", "tui", "k9s", "ml", "gpu", "kubernetes", "cloud"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console :: Curses",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Topic :: System :: Clustering",
    "Topic :: System :: Systems Administration",
]
dependencies = [
    "textual>=8,<9",
    "rich>=13",
    "pydantic>=2,<3",
    "pyyaml>=6,<7",
    "typer>=0.12",
    # Client side of SkyPilot. Keep the minor in lock-step with the API
    # server image used by `stratus sandbox` (see sandbox.py).
    "skypilot>=0.14.2,<0.15",
]

[project.scripts]
stratus = "stratus.cli:app"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "pytest-timeout>=2",
]

[build-system]
requires = ["uv_build>=0.11.1,<0.12"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "stratus"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
timeout = 60
markers = [
    "sandbox: end-to-end tests against a live `stratus sandbox` (deselect with '-m \"not sandbox\"')",
]
addopts = "-m 'not sandbox'"
