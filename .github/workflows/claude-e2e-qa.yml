name: Claude E2E QA

# Runs krayne's end-to-end QA on a GitHub-hosted runner, driven by Claude Code
# acting as a human QA engineer. Claude reads its runtime playbook from
# .github/claude/e2e-qa-instructions.md and, instead of re-running the pytest
# suites (those already run in ci.yml — re-running them here would be
# redundant), it manually provisions a sandbox and drives the real `krayne` CLI
# through five realistic user happy paths, then posts a structured results
# summary.
#
# Why a hosted runner: GitHub-hosted runners have unrestricted egress and
# Docker preinstalled, so the sandbox image pulls (quay.io, Docker Hub) and the
# in-pod service bootstraps (PyPI, code-server from GitHub releases) all work
# without the egress-proxy/allowlist friction seen in restricted environments.
#
# Authentication uses a Claude subscription (Pro/Max), not a pay-per-use API
# key. Generate a long-lived OAuth token locally with `claude setup-token` and
# store it as the repository secret CLAUDE_CODE_OAUTH_TOKEN (Settings → Secrets
# and variables → Actions). The QA step fails if the secret is unset.

on:
  # The nightly schedule lives in the `nightly-qa.yml` umbrella, which fans out
  # to this suite via workflow_call. This file keeps its own workflow_dispatch
  # so the E2E suite can still be run on its own.
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref (branch/SHA) to run QA against"
        required: false
        default: ""
  workflow_call:
    inputs:
      ref:
        description: "Git ref (branch/SHA) to run QA against"
        required: false
        type: string
        default: ""

concurrency:
  group: claude-e2e-qa-${{ github.ref }}
  cancel-in-progress: false

jobs:
  e2e-qa:
    name: Claude E2E QA
    runs-on: ubuntu-latest
    # Generous ceiling: sandbox provisioning + five sequential create/inspect/
    # delete happy paths (one cluster at a time) plus the cold Ray image pull.
    timeout-minutes: 50
    # Read-only QA: it reports results in the run log and does not write to the
    # repo or PRs, so contents stays read-only. id-token: write is REQUIRED by
    # claude-code-action — the action mints a GitHub OIDC token to exchange for
    # its app token, independent of cloud federation and of the Claude OAuth
    # token used for model inference. Without it the action fails at startup.
    permissions:
      contents: read
      id-token: write
    steps:
      # Third-party actions are pinned to commit SHAs (not moving tags) so a
      # hijacked/repointed tag can't run arbitrary code in the job that holds
      # the Claude token. Update the SHA + trailing version comment together.
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          # `inputs.ref` is populated for both workflow_dispatch and
          # workflow_call; falls back to the triggering ref.
          ref: ${{ inputs.ref || github.ref }}

      - name: Install uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Install Helm
        uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4

      - name: Install dependencies
        run: uv sync

      - name: Run E2E QA via Claude Code
        uses: anthropics/claude-code-action@36a69b6a90b850823f86de06fdfd56264772ad98 # v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            Read .github/claude/e2e-qa-instructions.md and follow it exactly.
            You are acting as a human QA engineer: do NOT run pytest. Instead,
            manually provision the sandbox (Phase 0, a hard gate) and drive the
            real `krayne` CLI through the five end-to-end happy paths, marking
            every PASS/FAIL checkbox from what you actually observe. Run all
            five scenarios even if an earlier one fails, so the report is
            complete. This is a read-only QA run: do not push code or modify
            pull requests.

            As the final action — always, whether QA passed or failed — write
            two files to the repository root using Bash:
              - qa-report.md: the full structured summary the instructions
                describe (SHA, per-scenario checkboxes, summary table, verdict +
                root cause, and diagnostics for any failures).
              - qa-verdict.txt: a single line containing exactly PASS (Phase 0
                and all five scenarios green) or FAIL (anything else). Nothing
                else.
            A later workflow step reads these to publish the report and set the
            job's success/failure state, so they must always be written.
          claude_args: |
            --allowedTools "Bash,Read,Glob,Grep"
            --model claude-opus-4-8
            --max-turns 100

      - name: Publish QA report
        if: always()
        run: |
          set -uo pipefail

          # Surface the agent's report both in the run summary (rendered) and in
          # the step log (so the failure reason is retrievable from the logs API,
          # not only from the Summary page).
          if [ -f qa-report.md ]; then
            cat qa-report.md >> "$GITHUB_STEP_SUMMARY"
            echo "::group::QA report (qa-report.md)"
            cat qa-report.md
            echo "::endgroup::"
          else
            {
              echo "## QA report missing"
              echo "The QA agent did not produce qa-report.md — treating as a failure."
            } | tee -a "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload QA artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: qa-results
          path: |
            qa-report.md
            qa-verdict.txt
          if-no-files-found: warn
          retention-days: 30

      - name: Gate on verdict
        if: always()
        id: verdict
        run: |
          set -uo pipefail

          # Fail-closed: any verdict other than an exact PASS fails the job,
          # which bubbles up to the overall workflow status.
          verdict="$(tr -d '[:space:]' < qa-verdict.txt 2>/dev/null || true)"
          [ -z "$verdict" ] && verdict="MISSING"
          echo "verdict=$verdict" >> "$GITHUB_OUTPUT"
          echo "QA verdict: $verdict"
          if [ "$verdict" != "PASS" ]; then
            echo "::error title=Krayne E2E QA::QA verdict is $verdict"
            exit 1
          fi


