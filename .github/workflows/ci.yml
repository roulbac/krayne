name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync

      - name: Run unit tests
        run: uv run pytest tests/unit -v --timeout=60

  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: unit-tests
    strategy:
      fail-fast: false
      matrix:
        suite:
          - name: mechanism
            selector: "not survives_head_pod_restart"
          - name: restart
            selector: "survives_head_pod_restart"
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Install Helm
        uses: azure/setup-helm@v4

      - name: Install dependencies
        run: uv sync

      - name: Run integration tests (${{ matrix.suite.name }})
        run: |
          set -o pipefail
          uv run pytest tests/integration -v -m integration --timeout=600 \
            -k "${{ matrix.suite.selector }}" 2>&1 | tee /tmp/pytest.log

      - name: Post diagnostics on failure
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          {
            echo "<!-- ci-diag -->"
            echo "### CI diagnostics — integration/${{ matrix.suite.name }}"
            echo ""
            echo "<details><summary>pytest tail</summary>"
            echo ""
            echo '```'
            tail -c 8000 /tmp/pytest.log 2>/dev/null || echo "(no pytest log)"
            echo '```'
            echo "</details>"
            echo ""
            echo "<details><summary>manager logs</summary>"
            echo ""
            echo '```'
            for f in ~/.krayne/tunnels/*/*.log; do
              [ -e "$f" ] || continue
              echo "== $f =="
              tail -c 6000 "$f"
            done 2>/dev/null || true
            echo '(end)'
            echo '```'
            echo "</details>"
          } > /tmp/diag.md
          gh pr comment 36 --repo roulbac/krayne --body-file /tmp/diag.md || true
