name: Build Ray Images

# Builds Ray container images (equivalent to rayproject/ray) and pushes them to
# Docker Hub with tags of the form:
#
#     {Ray version}-{Python version MAJOR.MINOR.PATCH}-{Platform}
#
# e.g. roulbac/ray:2.40.0-3.12.7-cpu
#
# Unlike the official py3xx tags, this pins the exact Python patch version.
#
# Required repository secrets (create these manually in repo Settings > Secrets):
#   DOCKERHUB_USERNAME  — Docker Hub account/namespace
#   DOCKERHUB_TOKEN     — Docker Hub access token with write scope

on:
  workflow_dispatch:

env:
  IMAGE: roulbac/ray
  PLATFORM: cpu
  BASE_IMAGE: ubuntu:22.04

jobs:
  build:
    name: ray ${{ matrix.ray_version }} / py ${{ matrix.python_version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Pinned list of Ray releases to build. Add/remove versions as needed.
        ray_version:
          - "2.40.0"
          - "2.43.0"
          - "2.46.0"
        # All supported Python patch versions for 3.12 and 3.13. Each must have
        # a conda-forge build. Add new patch releases here as they ship.
        # Note: older Ray releases predate Python 3.13 support — those jobs will
        # fail at the pip install step and simply won't publish (fail-fast is
        # disabled so other combinations still build).
        python_version:
          - "3.12.0"
          - "3.12.1"
          - "3.12.2"
          - "3.12.3"
          - "3.12.4"
          - "3.12.5"
          - "3.12.6"
          - "3.12.7"
          - "3.12.8"
          - "3.12.9"
          - "3.12.10"
          - "3.13.0"
          - "3.13.1"
          - "3.13.2"
          - "3.13.3"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: docker/ray
          file: docker/ray/Dockerfile
          push: true
          build-args: |
            RAY_VERSION=${{ matrix.ray_version }}
            PYTHON_VERSION=${{ matrix.python_version }}
            BASE_IMAGE=${{ env.BASE_IMAGE }}
          tags: |
            ${{ env.IMAGE }}:${{ matrix.ray_version }}-${{ matrix.python_version }}-${{ env.PLATFORM }}
            ${{ env.IMAGE }}:${{ matrix.ray_version }}-${{ matrix.python_version }}
          cache-from: type=gha,scope=${{ matrix.ray_version }}-${{ matrix.python_version }}
          cache-to: type=gha,mode=max,scope=${{ matrix.ray_version }}-${{ matrix.python_version }}
