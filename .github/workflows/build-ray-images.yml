name: Build Ray Images

# Builds Ray container images (equivalent to rayproject/ray) and pushes them to
# Docker Hub with tags of the form:
#
#     <IMAGE>:<RAY_VERSION>-py<PYTHON_VERSION>
#
# e.g. roulbac/ray:2.55.1-py3.13.6
#
# Unlike the official py3xx tags, this pins the exact Python patch version.
#
# Required repository secrets (create these manually in repo Settings > Secrets):
#   DOCKERHUB_USERNAME  — Docker Hub account/namespace
#   DOCKERHUB_TOKEN     — Docker Hub access token with write scope

on:
  workflow_dispatch:

env:
  IMAGE: roulbac/ray
  BASE_IMAGE: ubuntu:22.04

jobs:
  build:
    name: ray ${{ matrix.ray_version }} / py ${{ matrix.python_version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ray_version:
          - "2.55.1"
        python_version:
          - "3.13.6"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: docker/ray
          file: docker/ray/Dockerfile
          push: true
          build-args: |
            RAY_VERSION=${{ matrix.ray_version }}
            PYTHON_VERSION=${{ matrix.python_version }}
            BASE_IMAGE=${{ env.BASE_IMAGE }}
          tags: |
            ${{ env.IMAGE }}:${{ matrix.ray_version }}-py${{ matrix.python_version }}
          cache-from: type=gha,scope=${{ matrix.ray_version }}-py${{ matrix.python_version }}
          cache-to: type=gha,mode=max,scope=${{ matrix.ray_version }}-py${{ matrix.python_version }}
